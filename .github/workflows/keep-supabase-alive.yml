name: Keep Supabase Alive

# Roda a cada 4 dias (margem de segurança antes do limite de 7 dias do Supabase)
# e também pode ser disparado manualmente pela aba "Actions" do GitHub.
on:
  schedule:
    - cron: '0 12 */4 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer uma consulta leve ao Supabase
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/bancos?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Status HTTP: $HTTP_STATUS"
          cat /tmp/response.json

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase respondeu normalmente. Projeto continua ativo."
          else
            echo "❌ Supabase não respondeu como esperado (status $HTTP_STATUS)."
            exit 1
          fi
