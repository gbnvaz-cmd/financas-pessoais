<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanças Pessoais</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f3;color:#1a1a18;min-height:100vh}
.topbar{background:#fff;border-bottom:1px solid #e8e7e2;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:17px;font-weight:600;display:flex;align-items:center;gap:8px}
.topbar h1 i{font-size:20px;color:#1D9E75}
.topbar-right{display:flex;align-items:center;gap:12px}
.month-lbl{font-size:13px;color:#888780}
.sync{font-size:12px;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;background:#f5f5f3;border:1px solid #e8e7e2}
.sync.ok{color:#1D9E75}.sync.saving{color:#EF9F27}.sync.err{color:#D85A30}
.wrap{max-width:860px;margin:0 auto;padding:1.5rem}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.card{background:#fff;border-radius:12px;border:1px solid #eeecea;padding:1.25rem;text-align:center}
.card-lbl{font-size:12px;color:#888780;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.card-val{font-size:24px;font-weight:600}
.pos{color:#1D9E75}.neg{color:#D85A30}
.tabs{display:flex;gap:4px;margin-bottom:1.25rem;background:#fff;border:1px solid #eeecea;border-radius:10px;padding:4px;width:fit-content}
.tab{padding:7px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;background:transparent;color:#888780;font-weight:500}
.tab.active{background:#f5f5f3;color:#1a1a18}
.section{background:#fff;border:1px solid #eeecea;border-radius:12px;padding:1.5rem;margin-bottom:1.25rem}
.sec-title{font-size:11px;font-weight:600;color:#b4b2a9;margin-bottom:1.25rem;text-transform:uppercase;letter-spacing:.6px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:12px;font-weight:500;color:#5f5e5a}
.fg input,.fg select{width:100%;padding:9px 12px;font-size:14px;border:1px solid #e2e0db;border-radius:8px;background:#fff;color:#1a1a18;outline:none}
.fg input:focus,.fg select:focus{border-color:#1D9E75}
.btn{padding:9px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid #e2e0db;background:#fff;color:#1a1a18;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn-row{display:flex;justify-content:flex-end;margin-top:4px}
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;background:#fafaf8;border:1px solid #f0eeea}
.tx-ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:12px;color:#888780;margin-top:1px}
.tx-amt{font-size:15px;font-weight:600;white-space:nowrap}
.tx-del{background:none;border:none;cursor:pointer;color:#c8c6c0;padding:6px;border-radius:6px;display:flex;align-items:center;font-size:18px}
.tx-del:hover{color:#D85A30;background:#FAECE7}
.empty{text-align:center;padding:2.5rem;color:#b4b2a9;font-size:14px}
.empty i{font-size:36px;display:block;margin-bottom:10px}
.filter-row{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.filter-row select{padding:7px 12px;font-size:13px;border:1px solid #e2e0db;border-radius:8px;background:#fff;color:#1a1a18;outline:none}
.chart-wrap{position:relative;width:100%;height:260px}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:12px;color:#888780}
.legend span{display:flex;align-items:center;gap:5px}
.ldot{width:10px;height:10px;border-radius:2px}
.cat-bar{margin-bottom:10px}
.cat-lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.cat-lbl span:first-child{color:#1a1a18;font-weight:500}
.cat-lbl span:last-child{color:#888780}
.bar-bg{height:7px;border-radius:4px;background:#f0eeea;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.hidden{display:none}
.toast{position:fixed;bottom:24px;right:24px;background:#1a1a18;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.auth-box{background:#fff;border-radius:16px;border:1px solid #eeecea;padding:2.5rem;width:100%;max-width:380px;text-align:center}
.auth-box .icon{font-size:48px;color:#1D9E75;margin-bottom:12px;display:block}
.auth-box h2{font-size:20px;font-weight:600;margin-bottom:6px}
.auth-box p{font-size:14px;color:#888780;margin-bottom:24px;line-height:1.5}
.auth-box .fg{text-align:left;margin-bottom:12px}
.auth-error{color:#D85A30;font-size:13px;margin-bottom:12px;min-height:20px}
.auth-box .btn{width:100%;justify-content:center;margin-top:4px}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.spinner{width:32px;height:32px;border:3px solid #e8e7e2;border-top-color:#1D9E75;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen p{font-size:14px;color:#888780}
@media(max-width:600px){.cards{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.g2{grid-template-columns:1fr}.wrap{padding:1rem}.topbar{padding:0 1rem}}
</style>
</head>
<body>

<div id="screen-loading" class="loading-screen">
  <div class="spinner"></div>
  <p>Carregando...</p>
</div>

<div id="screen-auth" class="auth-wrap hidden">
  <div class="auth-box">
    <i class="ti ti-wallet icon"></i>
    <h2>Finanças Pessoais</h2>
    <p>Entre com seu e-mail e senha para acessar seus dados de qualquer lugar.</p>
    <div class="auth-error" id="auth-error"></div>
    <div class="fg"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
    <div class="fg"><label>Senha</label><input type="password" id="login-password" placeholder="••••••••"></div>
    <button class="btn primary" id="btn-login"><i class="ti ti-login"></i> Entrar</button>
  </div>
</div>

<div id="screen-app" class="hidden">
  <div class="topbar">
    <h1><i class="ti ti-wallet"></i> Finanças Pessoais</h1>
    <div class="topbar-right">
      <span class="sync hidden" id="sync"><i class="ti ti-cloud"></i> <span id="sync-txt"></span></span>
      <span class="month-lbl" id="month-lbl"></span>
      <button class="btn" id="btn-logout" style="padding:5px 12px;font-size:12px"><i class="ti ti-logout"></i> Sair</button>
    </div>
  </div>
  <div class="wrap">
    <div class="cards">
      <div class="card"><div class="card-lbl">Entradas</div><div class="card-val pos" id="v-in">R$ 0,00</div></div>
      <div class="card"><div class="card-lbl">Saídas</div><div class="card-val neg" id="v-out">R$ 0,00</div></div>
      <div class="card"><div class="card-lbl">Saldo do mês</div><div class="card-val" id="v-bal">R$ 0,00</div></div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="showTab('lancamentos')">Lançamentos</button>
      <button class="tab" onclick="showTab('historico')">Histórico</button>
      <button class="tab" onclick="showTab('analise')">Análise</button>
    </div>
    <div id="tab-lancamentos">
      <div class="section">
        <div class="sec-title">Novo lançamento</div>
        <div class="form-grid">
          <div class="fg"><label>Tipo</label><select id="tipo" onchange="updCats()"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div>
          <div class="fg"><label>Valor (R$)</label><input type="number" id="valor" placeholder="0,00" min="0" step="0.01"></div>
        </div>
        <div class="form-grid">
          <div class="fg"><label>Descrição</label><input type="text" id="desc" placeholder="Ex: Salário, Aluguel..."></div>
          <div class="fg"><label>Categoria</label><select id="cat"></select></div>
        </div>
        <div class="form-grid">
          <div class="fg"><label>Data</label><input type="date" id="data"></div>
          <div class="fg"><label>Observação (opcional)</label><input type="text" id="obs" placeholder="Detalhe adicional..."></div>
        </div>
        <div class="btn-row"><button class="btn primary" onclick="addTx()"><i class="ti ti-plus"></i> Adicionar</button></div>
      </div>
      <div class="section"><div class="sec-title">Lançamentos recentes</div><div class="tx-list" id="tx-recent"></div></div>
    </div>
    <div id="tab-historico" class="hidden">
      <div class="section">
        <div class="filter-row">
          <select id="f-month" onchange="renderHist()"><option value="">Todos os meses</option></select>
          <select id="f-tipo" onchange="renderHist()"><option value="">Entradas e saídas</option><option value="entrada">Entradas</option><option value="saida">Saídas</option></select>
          <select id="f-cat" onchange="renderHist()"><option value="">Todas as categorias</option></select>
        </div>
        <div class="tx-list" id="tx-all"></div>
      </div>
    </div>
    <div id="tab-analise" class="hidden">
      <div class="section">
        <div class="sec-title">Entradas × Saídas por mês</div>
        <div class="legend"><span><span class="ldot" style="background:#1D9E75"></span>Entradas</span><span><span class="ldot" style="background:#D85A30"></span>Saídas</span></div>
        <div class="chart-wrap"><canvas id="chart-mensal"></canvas></div>
      </div>
      <div class="g2">
        <div class="section"><div class="sec-title">Categorias de saída</div><div id="bars-saida"></div></div>
        <div class="section"><div class="sec-title">Categorias de entrada</div><div id="bars-entrada"></div></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL = 'https://yyxbbotabyyrjqoyqdbj.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5eGJib3RhYnl5cmpxb3lxZGJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwOTkxMzQsImV4cCI6MjA5NjY3NTEzNH0.fVXIYYHJiMPQDa5uaSzbJs_XU7CHkjWMrIgx_9iAoNU';

const { createClient } = supabase;
const db = createClient(SUPA_URL, SUPA_KEY);

const CATS_IN  = ['Salário','Freelance','Investimentos','Presente','Outros'];
const CATS_OUT = ['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Roupas','Serviços','Outros'];
const COLORS   = {Moradia:'#378ADD',Alimentação:'#1D9E75',Transporte:'#EF9F27',Saúde:'#D85A30',Educação:'#7F77DD',Lazer:'#D4537E',Roupas:'#5DCAA5',Serviços:'#888780',Salário:'#1D9E75',Freelance:'#378ADD',Investimentos:'#7F77DD',Presente:'#D4537E',Outros:'#B4B2A9'};
const MONTHS   = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

let txs = [], chart = null;

function show(id) {
  ['screen-loading','screen-auth','screen-app'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

// ─── AUTH ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-login').onclick = async () => {
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-password').value;
  document.getElementById('auth-error').textContent = '';
  if (!email || !pass) { document.getElementById('auth-error').textContent = 'Preencha e-mail e senha.'; return; }
  document.getElementById('btn-login').textContent = 'Entrando...';
  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  document.getElementById('btn-login').innerHTML = '<i class="ti ti-login"></i> Entrar';
  if (error) { document.getElementById('auth-error').textContent = 'E-mail ou senha incorretos.'; return; }
  await enterApp();
};

document.getElementById('btn-logout').onclick = async () => {
  await db.auth.signOut();
  txs = [];
  show('screen-auth');
};

document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('btn-login').click(); });

async function enterApp() {
  show('screen-loading');
  const { data, error } = await db.from('transacoes').select('*').order('data', { ascending: false });
  if (error) { console.error('Erro ao carregar:', error); txs = []; }
  else txs = data || [];
  show('screen-app');
  boot();
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) { await enterApp(); }
  else { show('screen-auth'); }
})();

// ─── UI ───────────────────────────────────────────────────────────────────────
const fmt   = v  => 'R$ ' + Math.abs(v).toLocaleString('pt-BR', {minimumFractionDigits:2,maximumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);
const mlbl  = ym => { const [y,m]=ym.split('-'); return MONTHS[+m-1]+'/'+y; };

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setSyncStatus(state, txt) {
  const el = document.getElementById('sync');
  el.className = 'sync ' + state;
  el.classList.remove('hidden');
  const icons = {ok:'ti-cloud-check',saving:'ti-cloud-upload',err:'ti-cloud-exclamation'};
  el.querySelector('i').className = 'ti ' + icons[state];
  document.getElementById('sync-txt').textContent = txt;
}

function boot() {
  document.getElementById('data').value = today();
  document.getElementById('month-lbl').textContent = new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  updCats(); populateFilters(); renderAll();
}

function updCats() {
  const cats = document.getElementById('tipo').value==='entrada' ? CATS_IN : CATS_OUT;
  document.getElementById('cat').innerHTML = cats.map(c=>`<option>${c}</option>`).join('');
}

async function addTx() {
  const tipo  = document.getElementById('tipo').value;
  const valor = parseFloat(document.getElementById('valor').value);
  const desc  = document.getElementById('desc').value.trim();
  const cat   = document.getElementById('cat').value;
  const data  = document.getElementById('data').value;
  const obs   = document.getElementById('obs').value.trim();
  if (!valor||valor<=0||!desc||!data) { showToast('Preencha valor, descrição e data.'); return; }
  setSyncStatus('saving','Salvando...');
  const { data: novo, error } = await db.from('transacoes').insert([{tipo,valor,desc,cat,data,obs}]).select().single();
  if (error) { setSyncStatus('err','Erro ao salvar'); console.error(error); return; }
  setSyncStatus('ok','Salvo');
  txs.unshift(novo);
  document.getElementById('valor').value='';
  document.getElementById('desc').value='';
  document.getElementById('obs').value='';
  document.getElementById('data').value=today();
  populateFilters(); renderAll();
  showToast('Lançamento adicionado!');
}

async function delTx(id) {
  if (!confirm('Remover este lançamento?')) return;
  setSyncStatus('saving','Removendo...');
  const { error } = await db.from('transacoes').delete().eq('id', id);
  if (error) { setSyncStatus('err','Erro ao remover'); return; }
  setSyncStatus('ok','Salvo');
  txs = txs.filter(t => t.id !== id);
  populateFilters(); renderAll();
}

function txHTML(t) {
  const isIn = t.tipo==='entrada';
  const cor  = isIn?'#1D9E75':'#D85A30', bg=isIn?'#E1F5EE':'#FAECE7';
  const ico  = isIn?'ti-arrow-down-circle':'ti-arrow-up-circle';
  const meta = t.obs ? `${t.cat} · ${t.data.split('-').reverse().join('/')} · ${t.obs}` : `${t.cat} · ${t.data.split('-').reverse().join('/')}`;
  return `<div class="tx">
    <div class="tx-ico" style="background:${bg}"><i class="ti ${ico}" style="color:${cor};font-size:18px"></i></div>
    <div class="tx-info"><div class="tx-desc">${t.desc}</div><div class="tx-meta">${meta}</div></div>
    <span class="tx-amt" style="color:${cor}">${isIn?'+':'-'}${fmt(t.valor)}</span>
    <button class="tx-del" onclick="delTx('${t.id}')"><i class="ti ti-trash" style="font-size:16px"></i></button>
  </div>`;
}

function renderAll() { updSummary(); renderRecent(); renderHist(); if(!document.getElementById('tab-analise').classList.contains('hidden')) renderAnalise(); }

function updSummary() {
  const ym  = new Date().toISOString().slice(0,7);
  const cur = txs.filter(t=>t.data&&t.data.startsWith(ym));
  const inp = cur.filter(t=>t.tipo==='entrada').reduce((s,t)=>s+Number(t.valor),0);
  const out = cur.filter(t=>t.tipo==='saida').reduce((s,t)=>s+Number(t.valor),0);
  const bal = inp-out;
  document.getElementById('v-in').textContent  = fmt(inp);
  document.getElementById('v-out').textContent = fmt(out);
  const el = document.getElementById('v-bal');
  el.textContent = (bal<0?'-':'')+fmt(Math.abs(bal));
  el.className = 'card-val '+(bal>=0?'pos':'neg');
}

function renderRecent() {
  const list = txs.slice(0,15);
  document.getElementById('tx-recent').innerHTML = list.length
    ? list.map(txHTML).join('')
    : '<div class="empty"><i class="ti ti-receipt-off"></i>Nenhum lançamento ainda.</div>';
}

function populateFilters() {
  const months = [...new Set(txs.filter(t=>t.data).map(t=>t.data.slice(0,7)))].sort().reverse();
  const ms=document.getElementById('f-month'), cm=ms.value;
  ms.innerHTML='<option value="">Todos os meses</option>'+months.map(m=>`<option value="${m}"${m===cm?' selected':''}>${mlbl(m)}</option>`).join('');
  const cats=[...new Set(txs.map(t=>t.cat))].sort();
  const cs=document.getElementById('f-cat'), cc=cs.value;
  cs.innerHTML='<option value="">Todas as categorias</option>'+cats.map(c=>`<option value="${c}"${c===cc?' selected':''}>${c}</option>`).join('');
}

function renderHist() {
  let list=txs;
  const fm=document.getElementById('f-month').value;
  const ft=document.getElementById('f-tipo').value;
  const fc=document.getElementById('f-cat').value;
  if(fm) list=list.filter(t=>t.data&&t.data.startsWith(fm));
  if(ft) list=list.filter(t=>t.tipo===ft);
  if(fc) list=list.filter(t=>t.cat===fc);
  document.getElementById('tx-all').innerHTML = list.length
    ? list.map(txHTML).join('')
    : '<div class="empty">Nenhum lançamento para os filtros selecionados.</div>';
}

function renderAnalise() {
  const months=[...new Set(txs.filter(t=>t.data).map(t=>t.data.slice(0,7)))].sort().slice(-6);
  const inData =months.map(m=>txs.filter(t=>t.data&&t.data.startsWith(m)&&t.tipo==='entrada').reduce((s,t)=>s+Number(t.valor),0));
  const outData=months.map(m=>txs.filter(t=>t.data&&t.data.startsWith(m)&&t.tipo==='saida').reduce((s,t)=>s+Number(t.valor),0));
  if(chart){chart.destroy();chart=null;}
  if(months.length>0){
    chart=new Chart(document.getElementById('chart-mensal'),{
      type:'bar',data:{labels:months.map(mlbl),datasets:[
        {label:'Entradas',data:inData, backgroundColor:'rgba(29,158,117,.8)',borderRadius:5},
        {label:'Saídas', data:outData,backgroundColor:'rgba(216,90,48,.8)', borderRadius:5}
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
        scales:{x:{grid:{display:false},ticks:{color:'#888780',font:{size:12}}},
                y:{grid:{color:'rgba(0,0,0,.06)'},ticks:{color:'#888780',font:{size:11},callback:v=>'R$'+Number(v).toLocaleString('pt-BR')}}}}
    });
  }
  function catBars(tipo,elId){
    const map={};txs.filter(t=>t.tipo===tipo).forEach(t=>{map[t.cat]=(map[t.cat]||0)+Number(t.valor);});
    const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,7);
    const total=sorted.reduce((s,[,v])=>s+v,0)||1;
    document.getElementById(elId).innerHTML=sorted.length
      ?sorted.map(([c,v])=>`<div class="cat-bar"><div class="cat-lbl"><span>${c}</span><span>${fmt(v)}</span></div><div class="bar-bg"><div class="bar-fill" style="width:${Math.round(v/total*100)}%;background:${COLORS[c]||'#888780'}"></div></div></div>`).join('')
      :'<div class="empty" style="padding:.75rem">Sem dados</div>';
  }
  catBars('saida','bars-saida'); catBars('entrada','bars-entrada');
}

function showTab(name) {
  ['lancamentos','historico','analise'].forEach((t,i)=>{
    document.getElementById('tab-'+t).classList.toggle('hidden',t!==name);
    document.querySelectorAll('.tab')[i].classList.toggle('active',t===name);
  });
  if(name==='analise') renderAnalise();
  if(name==='historico') renderHist();
}

document.getElementById('desc').addEventListener('keydown', e=>{if(e.key==='Enter')addTx();});
